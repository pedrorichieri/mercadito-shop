name: Test, build, publish and deploy (Kubernetes)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  images:
    name: Image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [storefront, catalog, cart, checkout, payments-mock]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name (lowercase, tagged with the commit SHA)
        id: meta
        run: |
          repo="$(echo "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${repo}-${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: images
    environment: prod
    env:
      NAMESPACE: ${{ vars.K8S_NAMESPACE || 'pedro-shop' }}
      SHOP_HOST: ${{ vars.SHOP_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_B64" | tr -d '[:space:]' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n "$NAMESPACE" auth can-i create deployments

      - name: Create or update Secrets
        env:
          SHOP_POSTGRES_URL: ${{ secrets.SHOP_POSTGRES_URL }}
          SHOP_REDIS_URL: ${{ secrets.SHOP_REDIS_URL }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          kubectl -n "$NAMESPACE" create secret generic shop-postgres \
            --from-literal=url="$SHOP_POSTGRES_URL" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic shop-redis \
            --from-literal=url="$SHOP_REDIS_URL" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          # Let every pod in the namespace pull the private GHCR images.
          kubectl -n "$NAMESPACE" patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Warn if Postgres or Redis are missing
        run: |
          for s in postgres redis; do
            kubectl -n "$NAMESPACE" get service "$s" >/dev/null 2>&1 \
              || echo "::warning::Service '$s' not found in $NAMESPACE (the Secrets point to it)"
          done

      - name: Prepare manifests with SHA-tagged images
        run: |
          repo="$(echo "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          mkdir -p out && cp deploy/base/*.yaml out/
          for svc in storefront catalog cart checkout payments-mock; do
            sed -i "s|REPLACE_ME|${repo}-${svc}:${GITHUB_SHA}|g" "out/${svc}.yaml"
          done
          # The migrate Job runs the catalog binary.
          sed -i "s|REPLACE_ME|${repo}-catalog:${GITHUB_SHA}|g" out/migrate-job.yaml
          if [ -n "$SHOP_HOST" ]; then
            sed -i "s|SHOP_HOST|${SHOP_HOST}|g" out/ingress.yaml
          else
            rm out/ingress.yaml
            echo "::notice::Variable SHOP_HOST is not set; skipping the Ingress."
          fi

      - name: Apply config and run the database migration
        run: |
          kubectl -n "$NAMESPACE" apply -f out/configmap.yaml
          # Dashboard de Grafana: lo recoge el sidecar de Grafana por la etiqueta grafana_dashboard.
          kubectl -n "$NAMESPACE" apply -f out/grafana-dashboard.yaml
          # Jobs are immutable: delete the previous one so the new image runs.
          kubectl -n "$NAMESPACE" delete job catalog-migrate --ignore-not-found --wait=true
          kubectl -n "$NAMESPACE" apply -f out/migrate-job.yaml
          kubectl -n "$NAMESPACE" wait --for=condition=complete job/catalog-migrate --timeout=300s \
            || { kubectl -n "$NAMESPACE" logs job/catalog-migrate --tail=50; exit 1; }

      - name: Deploy services
        run: |
          for f in payments-mock cart catalog checkout storefront; do
            kubectl -n "$NAMESPACE" apply -f "out/$f.yaml"
          done
          [ -f out/ingress.yaml ] && kubectl -n "$NAMESPACE" apply -f out/ingress.yaml || true
          kubectl -n "$NAMESPACE" apply -f out/hpa.yaml

      - name: Wait for rollouts
        run: |
          for d in payments-mock cart catalog checkout storefront; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=300s \
              || { kubectl -n "$NAMESPACE" get pods; kubectl -n "$NAMESPACE" describe deployment "$d" | tail -20; exit 1; }
          done
