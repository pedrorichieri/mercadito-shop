apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app: catalog
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      # Tiempo para drenar: /readyz pasa a 503 con SIGTERM y SHUTDOWN_DRAIN_SECONDS mantiene el servicio.
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: catalog
      containers:
      - name: catalog
        image: REPLACE_ME
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 384Mi }
        startupProbe:
          httpGet: { path: /readyz, port: 8081 }
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet: { path: /readyz, port: 8081 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /healthz, port: 8081 }
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: shop-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: shop-postgres
              key: url
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels:
    app: catalog
spec:
  selector:
    app: catalog
  ports:
  - port: 8081
    targetPort: 8081
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: catalog
