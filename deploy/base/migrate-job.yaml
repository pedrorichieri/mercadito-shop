apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: catalog-migrate
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: REPLACE_ME
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 192Mi }
        args: ["migrate"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: shop-postgres
              key: url
