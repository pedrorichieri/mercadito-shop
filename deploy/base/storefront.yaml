apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: storefront
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      # Tiempo para drenar: /readyz pasa a 503 con SIGTERM y SHUTDOWN_DRAIN_SECONDS mantiene el servicio.
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: storefront
      containers:
      - name: storefront
        image: REPLACE_ME
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 128Mi }
        startupProbe:
          httpGet: { path: /readyz, port: 8080 }
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          httpGet: { path: /readyz, port: 8080 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: shop-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  labels:
    app: storefront
spec:
  selector:
    app: storefront
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: storefront
