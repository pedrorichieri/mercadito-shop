apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-mock
  labels:
    app: payments-mock
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: payments-mock
  template:
    metadata:
      labels:
        app: payments-mock
    spec:
      # Tiempo para drenar: /readyz pasa a 503 con SIGTERM y SHUTDOWN_DRAIN_SECONDS mantiene el servicio.
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: payments-mock
      containers:
      - name: payments-mock
        image: REPLACE_ME
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits: { cpu: 100m, memory: 64Mi }
        startupProbe:
          httpGet: { path: /readyz, port: 8084 }
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          httpGet: { path: /readyz, port: 8084 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /healthz, port: 8084 }
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        ports:
        - containerPort: 8084
        envFrom:
        - configMapRef:
            name: shop-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: payments-mock
  labels:
    app: payments-mock
spec:
  selector:
    app: payments-mock
  ports:
  - port: 8084
    targetPort: 8084
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments-mock
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payments-mock
